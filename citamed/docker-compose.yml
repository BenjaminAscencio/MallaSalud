services:
  postgres:
    image: postgres:16-alpine
    container_name: citamed_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citamed_password
      POSTGRES_DB: citamed_db
    ports:
      - "5432:5432"
    volumes:
      - citamed_data:/var/lib/postgresql/data

volumes:
  citamed_data: